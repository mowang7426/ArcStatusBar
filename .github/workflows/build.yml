name: Build ArcStatusBar

# 触发: 修改代码时 / 手动触发(仓库 Actions 页面点 Run workflow)
on:
  push:
    paths:
      - 'Tweak.x'
      - 'ArcStatusBarViews.h'
      - 'ArcStatusBarViews.m'
      - 'Makefile'
      - 'control'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git

      - name: Setup theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Linux 交叉编译需要 iPhoneOS SDK
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          make clean || true
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcStatusBar-deb
          path: packages/*.deb

      # 打 tag 推上去时, 自动把 deb 挂到 Release
      - name: Attach deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
