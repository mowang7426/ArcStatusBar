name: Build ArcStatusBar (roothide)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install RootHide Theos (fork)
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R "iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Verify sources (确认编译的是最新代码)
        run: |
          set -e
          echo "--- Makefile 关键行 ---"
          grep -E "ARCHS|TARGET|SCHEME|SUBPROJECTS" Makefile
          echo "--- 编译错误修复点 1 (必须含 isKindOfClass, 不含 anyObject 直赋) ---"
          grep -n "isKindOfClass:UIWindowScene.class" ArcStatusBar/UI/ArcStatusController.m
          grep -c "anyObject;" ArcStatusBar/UI/ArcStatusController.m || true
          echo "--- 编译错误修复点 2 (不得有 UIScreen windowScene 赋值代码) ---"
          grep -n "scene = (UIWindowScene \*)UIScreen" ArcStatusBar/UI/ArcStatusController.m || echo "OK: 私有属性赋值已清除"
          grep -n "dispatch_after" ArcStatusBar/UI/ArcStatusController.m
          echo "--- control ---"
          grep -E "^(Package|Version|Architecture|Depends)" control

      - name: Build RootHide package
        run: |
          set -e
          make clean || true
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ArcStatusBar-v2.1-deb
          path: packages/*.deb
