name: Build ArcStatusBar

# 触发: 修改代码时 / 手动触发(仓库 Actions 页面点 Run workflow)
on:
  push:
    paths:
      - 'Tweak.x'
      - 'ArcStatusBarViews.h'
      - 'ArcStatusBarViews.m'
      - 'Makefile'
      - 'control'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git
          # theos 在 Linux 上打包需要 ldid (Procursus 版, 支持 arm64e 签名)
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

      - name: Setup theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          # Linux 交叉编译工具链 (theos 官方 install-theos 同源, 提供
          # toolchain/linux/iphone/bin/clang); 不装会报 clang: No such file
          curl -sL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz | tar -xJvf - -C "$HOME/theos" /toolchain/
          # theos 自带一个空的 sdks 目录, 必须先移除, 否则 clone 会冲突
          rm -rf "$HOME/theos/sdks"
          # 只拉取需要的 SDK (注意: theos/sdks 仓库最新只有 iPhoneOS16.5.sdk,
          # 没有 17.x, 但 16.5 SDK 已包含 _UIStatusBar 全套私有符号, 可正常编译)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk
          ls "$HOME/theos/sdks"
          ls "$HOME/theos/toolchain/linux/iphone/bin" | head -5
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          make clean || true
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcStatusBar-deb
          path: packages/*.deb

      # 打 tag 推上去时, 自动把 deb 挂到 Release
      - name: Attach deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
