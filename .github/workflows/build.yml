name: Build ArcStatusBar

on:
  push:
    paths:
      - 'Tweak.x'
      - 'ArcStatusBarViews.h'
      - 'ArcStatusBarViews.m'
      - 'Makefile'
      - 'control'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git
          curl -sL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid

      - name: Setup theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          git sparse-checkout set iPhoneOS17.0.sdk
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          make clean || true
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcStatusBar-deb
          path: packages/*.deb

      - name: Attach deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
